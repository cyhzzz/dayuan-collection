<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大元收藏品集 - 后台管理</title>
  <meta name="description" content="大元收藏品集后台管理系统">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --admin-bg: #F5F0E8;
      --admin-card: #ffffff;
      --admin-primary: #5C3D2E;
      --admin-secondary: #D2B48C;
      --admin-accent: #B87333;
      --admin-text: #5C3D2E;
      --admin-text-light: #8B7355;
      --admin-border: #E0D6C2;
      --admin-success: #28a745;
      --admin-danger: #dc3545;
      --admin-warning: #ffc107;
    }

    body {
      background: var(--admin-bg);
      font-family: 'Noto Sans SC', sans-serif;
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* 后台头部 */
    .admin-header {
      background: linear-gradient(135deg, #5C3D2E 0%, #654321 100%);
      color: #F5F0E8;
      padding: 2rem;
      border-radius: 16px;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(92, 61, 46, 0.2);
    }

    .admin-header h1 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-weight: 400;
      letter-spacing: 4px;
    }

    .admin-header p {
      opacity: 0.7;
      font-size: 0.95rem;
      color: rgba(245, 240, 232, 0.7);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #F5F0E8;
      text-decoration: none;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      background: rgba(245, 240, 232, 0.1);
      border-radius: 8px;
      transition: background 0.3s;
      font-size: 0.9rem;
    }

    .back-link:hover {
      background: rgba(245, 240, 232, 0.2);
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--admin-card);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(92, 61, 46, 0.08);
      text-align: center;
      border: 1px solid var(--admin-border);
    }

    .stat-card .number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--admin-primary);
      margin-bottom: 0.25rem;
      font-family: 'ZCOOL XiaoWei', serif;
    }

    .stat-card .label {
      color: var(--admin-text-light);
      font-size: 0.9rem;
    }

    /* 标签页 */
    .admin-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: var(--admin-card);
      padding: 0.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(92, 61, 46, 0.05);
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'Noto Sans SC', sans-serif;
      color: var(--admin-text-light);
      border-radius: 8px;
      transition: all 0.3s;
    }

    .tab-btn:hover {
      background: var(--admin-bg);
      color: var(--admin-primary);
    }

    .tab-btn.active {
      background: var(--admin-primary);
      color: #F5F0E8;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 卡片样式 */
    .admin-card {
      background: var(--admin-card);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(92, 61, 46, 0.08);
      margin-bottom: 2rem;
      border: 1px solid var(--admin-border);
    }

    .admin-card h2 {
      color: var(--admin-primary);
      margin-bottom: 1.5rem;
      font-weight: 400;
      font-size: 1.5rem;
      font-family: 'ZCOOL XiaoWei', serif;
      letter-spacing: 2px;
    }

    /* 按钮样式 */
    .btn {
      padding: 0.6rem 1.25rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Noto Sans SC', sans-serif;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--admin-primary), #654321);
      color: #F5F0E8;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 12px rgba(92, 61, 46, 0.25);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--admin-secondary);
      color: var(--admin-primary);
    }

    .btn-danger {
      background: var(--admin-danger);
      color: #fff;
    }

    .btn-success {
      background: var(--admin-success);
      color: #fff;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* 表单样式 */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--admin-text);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: 'Noto Sans SC', sans-serif;
      transition: border-color 0.3s;
      background: #fff;
      color: var(--admin-text);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--admin-accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    /* 列表样式 */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .list-item {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 1rem;
      background: var(--admin-bg);
      border-radius: 12px;
      border: 1px solid var(--admin-border);
      transition: all 0.3s;
    }

    .list-item:hover {
      border-color: var(--admin-accent);
    }

    .list-item-thumb {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--admin-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .list-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .list-item-thumb .no-img {
      color: var(--admin-text-light);
      font-size: 0.75rem;
      text-align: center;
    }

    .list-item .item-info {
      flex: 1;
      min-width: 0;
    }

    .list-item .item-info h4 {
      color: var(--admin-primary);
      margin-bottom: 0.25rem;
      font-size: 1.05rem;
      font-family: 'Noto Serif SC', serif;
    }

    .list-item .item-info p {
      color: var(--admin-text-light);
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-item .item-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .list-item .item-actions button {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    /* 模态框 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(92, 61, 46, 0.5);
      z-index: 1000;
      padding: 2rem;
      overflow-y: auto;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--admin-card);
      padding: 2rem;
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(92, 61, 46, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--admin-border);
    }

    .modal-header h2 {
      color: var(--admin-primary);
      font-weight: 400;
      margin: 0;
      font-family: 'ZCOOL XiaoWei', serif;
      letter-spacing: 2px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--admin-text-light);
    }

    /* 搜索和筛选 */
    .search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-bar input {
      flex: 1;
      min-width: 250px;
    }

    /* 图片上传区域 */
    .upload-area {
      border: 2px dashed var(--admin-border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: var(--admin-bg);
      margin-bottom: 1rem;
    }

    .upload-area:hover,
    .upload-area.dragover {
      border-color: var(--admin-accent);
      background: rgba(184, 115, 51, 0.05);
    }

    .upload-area p {
      color: var(--admin-text-light);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .upload-area .upload-hint {
      font-size: 0.8rem;
      color: var(--admin-text-light);
      opacity: 0.6;
    }

    .upload-progress {
      display: none;
      margin-bottom: 1rem;
    }

    .upload-progress .progress-bar {
      height: 6px;
      background: var(--admin-border);
      border-radius: 3px;
      overflow: hidden;
    }

    .upload-progress .progress-fill {
      height: 100%;
      background: var(--admin-accent);
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }

    .upload-progress .progress-text {
      font-size: 0.8rem;
      color: var(--admin-text-light);
      margin-top: 0.25rem;
    }

    /* 图片预览网格 */
    .image-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .image-preview-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--admin-border);
      aspect-ratio: 1;
    }

    .image-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-preview-item .remove-img {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      background: rgba(220, 53, 69, 0.9);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .image-preview-item:hover .remove-img {
      opacity: 1;
    }

    /* 分类列表带封面 */
    .category-list-item {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 1rem;
      background: var(--admin-bg);
      border-radius: 12px;
      border: 1px solid var(--admin-border);
      transition: all 0.3s;
    }

    .category-list-item:hover {
      border-color: var(--admin-accent);
    }

    .category-list-item .cat-thumb {
      width: 80px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--admin-secondary);
    }

    .category-list-item .cat-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-list-item .cat-info {
      flex: 1;
    }

    .category-list-item .cat-info h4 {
      color: var(--admin-primary);
      margin-bottom: 0.25rem;
      font-family: 'Noto Serif SC', serif;
    }

    .category-list-item .cat-info p {
      color: var(--admin-text-light);
      font-size: 0.85rem;
    }

    /* 通知消息 */
    .notification {
      position: fixed;
      top: 2rem;
      right: 2rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      color: #fff;
      font-weight: 500;
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transform: translateX(400px);
      transition: transform 0.3s ease;
      font-size: 0.9rem;
    }

    .notification.show {
      transform: translateX(0);
    }

    .notification.success { background: var(--admin-success); }
    .notification.error { background: var(--admin-danger); }
    .notification.warning { background: var(--admin-warning); color: #333; }

    /* 响应式 */
    @media (max-width: 768px) {
      .admin-container { padding: 1rem; }
      .admin-header h1 { font-size: 1.5rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-card .number { font-size: 2rem; }
      .admin-tabs { overflow-x: auto; }
      .list-item { flex-direction: column; align-items: flex-start; }
      .list-item .item-actions { width: 100%; }
      .image-preview-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- 后台头部 -->
    <header class="admin-header">
      <a href="index.html" class="back-link">← 返回首页</a>
      <h1>大元收藏品集 · 后台管理</h1>
      <p>管理分类、藏品和数据维护</p>
    </header>

    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="total-categories">0</div>
        <div class="label">总分类数</div>
      </div>
      <div class="stat-card">
        <div class="number" id="total-items">0</div>
        <div class="label">总藏品数</div>
      </div>
      <div class="stat-card">
        <div class="number" id="total-images">0</div>
        <div class="label">图片数量</div>
      </div>
      <div class="stat-card">
        <div class="number" id="storage-status">检测中</div>
        <div class="label">数据来源</div>
      </div>
    </div>

    <!-- 标签页导航 -->
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="categories">分类管理</button>
      <button class="tab-btn" data-tab="items">藏品管理</button>
      <button class="tab-btn" data-tab="export">数据导出</button>
    </div>

    <!-- 分类管理 -->
    <div id="categories-tab" class="tab-content active">
      <div class="admin-card">
        <div class="list-header">
          <h2>分类列表</h2>
          <button class="btn btn-primary" id="add-category-btn">+ 添加分类</button>
        </div>
        <div id="categories-list" class="item-list"></div>
      </div>
    </div>

    <!-- 藏品管理 -->
    <div id="items-tab" class="tab-content">
      <div class="admin-card">
        <div class="list-header">
          <h2>藏品列表</h2>
          <button class="btn btn-primary" id="add-item-btn">+ 添加藏品</button>
        </div>

        <div class="search-bar">
          <input type="text" id="item-search" placeholder="搜索藏品名称或描述...">
          <select id="item-filter-category">
            <option value="all">所有分类</option>
          </select>
        </div>

        <div id="items-list" class="item-list"></div>
      </div>
    </div>

    <!-- 数据导出 -->
    <div id="export-tab" class="tab-content">
      <div class="admin-card">
        <h2>数据导出</h2>
        <p>导出数据为 JSON 格式，便于备份和编辑。</p>
        <div class="btn-group" style="margin-top: 1.5rem;">
          <button class="btn btn-primary" id="export-categories-btn">导出分类数据</button>
          <button class="btn btn-secondary" id="export-items-btn">导出藏品数据</button>
          <button class="btn btn-success" id="export-all-btn">导出全部数据</button>
        </div>
        <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--admin-border);">
          <h3 style="margin-bottom: 1rem; color: var(--admin-primary); font-family: 'Noto Serif SC', serif;">数据导入</h3>
          <p style="margin-bottom: 1rem; color: var(--admin-text-light); font-size: 0.9rem;">导入本地 JSON 文件更新数据</p>
          <input type="file" id="import-file" accept=".json" style="margin-top: 1rem;">
          <div class="btn-group" style="margin-top: 1rem;">
            <button class="btn btn-primary" id="import-data-btn">导入数据</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加/编辑分类模态框 -->
  <div id="category-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="category-modal-title">添加分类</h2>
        <button class="modal-close" id="close-category-modal">&times;</button>
      </div>
      <form id="category-form">
        <input type="hidden" id="category-id">
        <div class="form-group">
          <label>分类ID</label>
          <input type="text" id="category-form-id" placeholder="例如: jade, wood" required>
        </div>
        <div class="form-group">
          <label>分类名称</label>
          <input type="text" id="category-form-name" placeholder="例如: 大元藏玉" required>
        </div>
        <div class="form-group">
          <label>分类描述</label>
          <textarea id="category-form-description" rows="3" placeholder="描述这个分类..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>类型标签</label>
            <input type="text" id="category-form-type" placeholder="例如: 玉器">
          </div>
          <div class="form-group">
            <label>年代</label>
            <input type="text" id="category-form-period" placeholder="例如: 唐宋元明清">
          </div>
        </div>
        <div class="form-group">
          <label>封面图片</label>
          <div class="upload-area" id="category-cover-upload">
            <p>点击或拖拽上传封面图片</p>
            <span class="upload-hint">支持 JPG、PNG，最大 5MB</span>
          </div>
          <input type="file" id="category-cover-file" accept="image/*" style="display:none;">
          <div id="category-cover-preview" class="image-preview-grid"></div>
          <input type="hidden" id="category-form-image">
        </div>
        <div class="btn-group" style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary">保存分类</button>
          <button type="button" class="btn btn-secondary" id="cancel-category-btn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 添加/编辑藏品模态框 -->
  <div id="item-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="item-modal-title">添加藏品</h2>
        <button class="modal-close" id="close-item-modal">&times;</button>
      </div>
      <form id="item-form">
        <input type="hidden" id="item-id">
        <div class="form-row">
          <div class="form-group">
            <label>藏品ID</label>
            <input type="text" id="item-form-id" placeholder="例如: jade-001" required>
          </div>
          <div class="form-group">
            <label>所属分类</label>
            <select id="item-form-category" required></select>
          </div>
        </div>
        <div class="form-group">
          <label>藏品名称</label>
          <input type="text" id="item-form-name" placeholder="藏品名称" required>
        </div>
        <div class="form-group">
          <label>藏品描述</label>
          <textarea id="item-form-description" rows="4" placeholder="详细描述..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>材质</label>
            <input type="text" id="item-form-material" placeholder="例如: 和田白玉">
          </div>
          <div class="form-group">
            <label>年代</label>
            <input type="text" id="item-form-period" placeholder="例如: 清代">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>尺寸</label>
            <input type="text" id="item-form-dimensions" placeholder="例如: 高10cm, 宽5cm">
          </div>
          <div class="form-group">
            <label>来源</label>
            <input type="text" id="item-form-source" placeholder="例如: 私人收藏">
          </div>
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="item-form-notes" rows="3" placeholder="其他备注信息..."></textarea>
        </div>
        <div class="form-group">
          <label>藏品图片</label>
          <div class="upload-area" id="item-images-upload">
            <p>点击或拖拽上传图片（支持多张）</p>
            <span class="upload-hint">支持 JPG、PNG，单张最大 5MB</span>
          </div>
          <input type="file" id="item-images-file" accept="image/*" multiple style="display:none;">
          <div class="upload-progress" id="upload-progress">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="progress-text" id="progress-text">上传中...</div>
          </div>
          <div id="item-images-preview" class="image-preview-grid"></div>
          <input type="hidden" id="item-form-images">
        </div>
        <div class="btn-group" style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary">保存藏品</button>
          <button type="button" class="btn btn-secondary" id="cancel-item-btn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div id="delete-modal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2>确认删除</h2>
        <button class="modal-close" id="close-delete-modal">&times;</button>
      </div>
      <p style="margin-bottom: 2rem; font-size: 1rem; color: var(--admin-text);">确定要删除这个项目吗？此操作无法撤销。</p>
      <div class="btn-group">
        <button class="btn btn-danger" id="confirm-delete-btn">确认删除</button>
        <button class="btn btn-secondary" id="cancel-delete-btn">取消</button>
      </div>
    </div>
  </div>

  <!-- 通知消息 -->
  <div id="notification" class="notification"></div>

  <script type="module">
    // 动态导入 Supabase SDK（ESM 格式，避免 Tracking Prevention 拦截 CDN）
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.39.7');
    window.supabase = { createClient };
    // 触发自定义事件通知主脚本 SDK 已加载
    window.dispatchEvent(new Event('supabase-ready'));
  </script>
  <script>
    // ========== 配置 ==========
    const SUPABASE_URL = 'https://yykqbhuzsnwdrlyhbwdu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cwKH3e5N24GE65spjuz8aQ_lQp78Hol';
    const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5a3FiaHV6c253ZHJseWhid2R1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NjY2ODc0NSwiZXhwIjoyMDkyMjQ0NzQ1fQ.Sg10ZQWNX6JBsaNvPXPFPrwkVY5orKhGrpQPtz0Bg3M';
    const STORAGE_BUCKET = 'images';

    // 等待 SDK 加载完成
    function waitForSupabase() {
      return new Promise((resolve) => {
        if (window.supabase && window.supabase.createClient) {
          resolve();
        } else {
          window.addEventListener('supabase-ready', resolve, { once: true });
        }
      });
    }

    async function initApp() {
      await waitForSupabase();
      const { createClient } = window.supabase;

    // 公开客户端（读取数据）
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storageKey: 'supabase_admin', autoRefreshToken: false, persistSession: false }
    });

    // 管理客户端（上传文件，绕过 RLS）
    const supabaseAdmin = createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY, {
      auth: { storageKey: 'supabase_admin_sr', autoRefreshToken: false, persistSession: false }
    });

    // ========== 状态 ==========
    let categories = [];
    let items = [];
    let deleteTarget = null;
    let editingItemImages = []; // 当前编辑中的图片URL列表

    // ========== 工具函数 ==========
    function showNotification(message, type = 'success') {
      const n = document.getElementById('notification');
      n.textContent = message;
      n.className = `notification ${type} show`;
      setTimeout(() => n.classList.remove('show'), 3000);
    }

    function getPublicUrl(path) {
      return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
    }

    function getThumbUrl(item) {
      if (item.images && item.images.length > 0) {
        const img = item.images[0];
        // 如果已经是完整URL就直接用
        if (img.startsWith('http')) return img;
        // 如果是 Storage 路径
        if (img.startsWith('items/')) return getPublicUrl(img);
        // 兼容旧的本地路径
        return img;
      }
      return '';
    }

    function getCategoryThumb(cat) {
      if (cat.image) {
        if (cat.image.startsWith('http')) return cat.image;
        if (cat.image.startsWith('categories/')) return getPublicUrl(cat.image);
        return cat.image;
      }
      return '';
    }

    // ========== 图片上传 ==========
    async function uploadImage(file, folder) {
      const ext = file.name.split('.').pop();
      const timestamp = Date.now();
      const randomStr = Math.random().toString(36).substring(2, 8);
      const path = `${folder}/${timestamp}_${randomStr}.${ext}`;

      const { data, error } = await supabaseAdmin.storage
        .from(STORAGE_BUCKET)
        .upload(path, file, {
          cacheControl: '3600',
          upsert: false
        });

      if (error) {
        console.error('上传失败:', error);
        throw error;
      }

      return path; // 返回 Storage 路径
    }

    async function deleteImage(path) {
      if (!path) return;
      // 只删除 Storage 中的文件，不删本地路径
      if (path.startsWith('items/') || path.startsWith('categories/')) {
        try {
          await supabaseAdmin.storage.from(STORAGE_BUCKET).remove([path]);
        } catch (e) {
          console.warn('删除图片失败:', e);
        }
      }
    }

    // ========== 数据加载（仅 Supabase） ==========
    async function loadData() {
      try {
        // 第一步：只查数量
        const [catCountRes, itemCountRes] = await Promise.all([
          supabaseClient.from('categories').select('id', { count: 'exact', head: true }),
          supabaseClient.from('items').select('id', { count: 'exact', head: true })
        ]);

        const catCount = catCountRes.count || 0;
        const itemCount = itemCountRes.count || 0;

        // 第二步：加载实际数据
        const [catRes, itemRes] = await Promise.all([
          supabaseClient.from('categories').select('*'),
          supabaseClient.from('items').select('*')
        ]);

        categories = catRes.data || [];
        items = itemRes.data || [];

        document.getElementById('storage-status').textContent = 'Supabase';
        showNotification(`数据加载成功（${categories.length} 分类 / ${items.length} 藏品）`, 'success');

      } catch (error) {
        console.error('数据加载失败:', error);
        categories = [];
        items = [];
        document.getElementById('storage-status').textContent = '加载失败';
        showNotification('从 Supabase 加载数据失败，请检查网络连接', 'error');
      }

      updateStats();
      renderCategories();
      renderItems();
      populateCategorySelects();
    }

    // ========== 统计 ==========
    function updateStats() {
      document.getElementById('total-categories').textContent = categories.length;
      document.getElementById('total-items').textContent = items.length;
      const imgCount = items.reduce((sum, item) => sum + (item.images ? item.images.length : 0), 0);
      document.getElementById('total-images').textContent = imgCount;
    }

    // ========== 下拉框 ==========
    function populateCategorySelects() {
      const filterSelect = document.getElementById('item-filter-category');
      const formSelect = document.getElementById('item-form-category');

      filterSelect.innerHTML = '<option value="all">所有分类</option>' +
        categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
      formSelect.innerHTML = categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
    }

    // ========== 渲染分类列表（带封面图） ==========
    function renderCategories() {
      const container = document.getElementById('categories-list');
      container.innerHTML = categories.map(cat => {
        const thumbUrl = getCategoryThumb(cat);
        return `
          <div class="category-list-item">
            <div class="cat-thumb">
              ${thumbUrl ? `<img src="${thumbUrl}" alt="${cat.name}" onerror="this.parentElement.innerHTML='<div class=no-img>无封面</div>'">` : '<div class="no-img">无封面</div>'}
            </div>
            <div class="cat-info">
              <h4>${cat.name}</h4>
              <p>${cat.description || '暂无描述'} · 类型: ${cat.type || '未分类'} · ${cat.items_count || 0} 件</p>
            </div>
            <div class="item-actions">
              <button class="btn btn-secondary" onclick="editCategory('${cat.id}')">编辑</button>
              <button class="btn btn-danger" onclick="confirmDelete('category', '${cat.id}')">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ========== 渲染藏品列表（带图片预览） ==========
    function renderItems(searchKeyword = '', categoryId = 'all') {
      let filtered = items;

      if (categoryId !== 'all') {
        filtered = filtered.filter(item => item.category_id === categoryId);
      }
      if (searchKeyword) {
        const kw = searchKeyword.toLowerCase();
        filtered = filtered.filter(item =>
          item.name.toLowerCase().includes(kw) ||
          (item.description && item.description.toLowerCase().includes(kw))
        );
      }

      const container = document.getElementById('items-list');
      container.innerHTML = filtered.map(item => {
        const category = categories.find(c => c.id === item.category_id);
        const thumbUrl = getThumbUrl(item);
        return `
          <div class="list-item">
            <div class="list-item-thumb">
              ${thumbUrl ? `<img src="${thumbUrl}" alt="${item.name}" onerror="this.parentElement.innerHTML='<div class=no-img>无图</div>'">` : '<div class="no-img">无图</div>'}
            </div>
            <div class="item-info">
              <h4>${item.name}</h4>
              <p>${category ? category.name : '未分类'} · ${item.material || '材质未知'} · ${item.period || '年代未知'}</p>
            </div>
            <div class="item-actions">
              <button class="btn btn-secondary" onclick="editItem('${item.id}')">编辑</button>
              <button class="btn btn-danger" onclick="confirmDelete('item', '${item.id}')">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ========== 标签页切换 ==========
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabId = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`${tabId}-tab`).classList.add('active');
      });
    });

    // ========== 分类 CRUD ==========
    document.getElementById('add-category-btn').addEventListener('click', () => {
      document.getElementById('category-modal-title').textContent = '添加分类';
      document.getElementById('category-form').reset();
      document.getElementById('category-id').value = '';
      document.getElementById('category-form-image').value = '';
      document.getElementById('category-cover-preview').innerHTML = '';
      document.getElementById('category-modal').classList.add('active');
    });

    // 分类封面上传
    const catCoverUpload = document.getElementById('category-cover-upload');
    const catCoverFile = document.getElementById('category-cover-file');

    catCoverUpload.addEventListener('click', () => catCoverFile.click());
    catCoverUpload.addEventListener('dragover', e => { e.preventDefault(); catCoverUpload.classList.add('dragover'); });
    catCoverUpload.addEventListener('dragleave', () => catCoverUpload.classList.remove('dragover'));
    catCoverUpload.addEventListener('drop', e => {
      e.preventDefault();
      catCoverUpload.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleCategoryCover(e.dataTransfer.files[0]);
    });
    catCoverFile.addEventListener('change', e => {
      if (e.target.files.length > 0) handleCategoryCover(e.target.files[0]);
    });

    async function handleCategoryCover(file) {
      if (!file.type.startsWith('image/')) {
        showNotification('请选择图片文件', 'error');
        return;
      }
      try {
        showNotification('正在上传封面...', 'warning');
        const path = await uploadImage(file, 'categories');
        const url = getPublicUrl(path);
        document.getElementById('category-form-image').value = path;
        document.getElementById('category-cover-preview').innerHTML =
          `<div class="image-preview-item"><img src="${url}" alt="封面预览"><button type="button" class="remove-img" onclick="removeCategoryCover()">&times;</button></div>`;
        showNotification('封面上传成功', 'success');
      } catch (err) {
        showNotification('封面上传失败: ' + err.message, 'error');
      }
    }

    function removeCategoryCover() {
      document.getElementById('category-form-image').value = '';
      document.getElementById('category-cover-preview').innerHTML = '';
    }

    function editCategory(id) {
      const cat = categories.find(c => c.id === id);
      if (!cat) return;

      document.getElementById('category-modal-title').textContent = '编辑分类';
      document.getElementById('category-id').value = cat.id;
      document.getElementById('category-form-id').value = cat.id;
      document.getElementById('category-form-name').value = cat.name;
      document.getElementById('category-form-description').value = cat.description || '';
      document.getElementById('category-form-type').value = cat.type || '';
      document.getElementById('category-form-period').value = cat.period || '';
      document.getElementById('category-form-image').value = cat.image || '';

      const thumbUrl = getCategoryThumb(cat);
      document.getElementById('category-cover-preview').innerHTML = thumbUrl
        ? `<div class="image-preview-item"><img src="${thumbUrl}" alt="封面预览"><button type="button" class="remove-img" onclick="removeCategoryCover()">&times;</button></div>`
        : '';

      document.getElementById('category-modal').classList.add('active');
    }

    document.getElementById('category-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('category-id').value;
      const newId = document.getElementById('category-form-id').value;
      const categoryData = {
        id: newId,
        name: document.getElementById('category-form-name').value,
        description: document.getElementById('category-form-description').value,
        type: document.getElementById('category-form-type').value,
        period: document.getElementById('category-form-period').value,
        image: document.getElementById('category-form-image').value,
        items_count: 0
      };

      try {
        if (id && id !== newId) {
          categories = categories.filter(c => c.id !== id);
          await supabaseAdmin.from('categories').delete().eq('id', id);
        }
        const idx = categories.findIndex(c => c.id === newId);
        if (idx >= 0) categories[idx] = categoryData;
        else categories.push(categoryData);

        await supabaseAdmin.from('categories').upsert(categoryData, { onConflict: 'id' });

        document.getElementById('category-modal').classList.remove('active');
        updateStats();
        renderCategories();
        populateCategorySelects();
        showNotification('分类保存成功');
      } catch (err) {
        console.error(err);
        showNotification('保存失败: ' + err.message, 'error');
      }
    });

    // ========== 藏品 CRUD ==========
    document.getElementById('add-item-btn').addEventListener('click', () => {
      document.getElementById('item-modal-title').textContent = '添加藏品';
      document.getElementById('item-form').reset();
      document.getElementById('item-id').value = '';
      document.getElementById('item-form-images').value = '';
      document.getElementById('item-images-preview').innerHTML = '';
      editingItemImages = [];
      document.getElementById('item-modal').classList.add('active');
    });

    // 藏品图片上传
    const itemImagesUpload = document.getElementById('item-images-upload');
    const itemImagesFile = document.getElementById('item-images-file');

    itemImagesUpload.addEventListener('click', () => itemImagesFile.click());
    itemImagesUpload.addEventListener('dragover', e => { e.preventDefault(); itemImagesUpload.classList.add('dragover'); });
    itemImagesUpload.addEventListener('dragleave', () => itemImagesUpload.classList.remove('dragover'));
    itemImagesUpload.addEventListener('drop', e => {
      e.preventDefault();
      itemImagesUpload.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleItemImages(e.dataTransfer.files);
    });
    itemImagesFile.addEventListener('change', e => {
      if (e.target.files.length > 0) handleItemImages(e.target.files);
    });

    async function handleItemImages(files) {
      const progressDiv = document.getElementById('upload-progress');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');
      progressDiv.style.display = 'block';

      const total = files.length;
      let done = 0;

      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        try {
          progressText.textContent = `上传中 ${done + 1}/${total}...`;
          const path = await uploadImage(file, 'items');
          editingItemImages.push(path);

          // 添加预览
          const url = getPublicUrl(path);
          const idx = editingItemImages.length - 1;
          document.getElementById('item-images-preview').innerHTML += `
            <div class="image-preview-item" data-idx="${idx}">
              <img src="${url}" alt="预览">
              <button type="button" class="remove-img" onclick="removeItemImage(${idx})">&times;</button>
            </div>`;
        } catch (err) {
          showNotification(`图片 ${file.name} 上传失败`, 'error');
        }
        done++;
        progressFill.style.width = `${(done / total) * 100}%`;
      }

      progressText.textContent = `上传完成 ${done}/${total}`;
      setTimeout(() => { progressDiv.style.display = 'none'; }, 1500);
      updateImagesInput();
      showNotification(`成功上传 ${done} 张图片`, 'success');
    }

    function removeItemImage(idx) {
      const path = editingItemImages[idx];
      deleteImage(path);
      editingItemImages.splice(idx, 1);
      refreshImagePreviews();
      updateImagesInput();
    }

    function refreshImagePreviews() {
      const container = document.getElementById('item-images-preview');
      container.innerHTML = editingItemImages.map((path, idx) => {
        const url = path.startsWith('http') ? path : getPublicUrl(path);
        return `
          <div class="image-preview-item" data-idx="${idx}">
            <img src="${url}" alt="预览">
            <button type="button" class="remove-img" onclick="removeItemImage(${idx})">&times;</button>
          </div>`;
      }).join('');
    }

    function updateImagesInput() {
      document.getElementById('item-form-images').value = editingItemImages.join(',');
    }

    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('item-modal-title').textContent = '编辑藏品';
      document.getElementById('item-id').value = item.id;
      document.getElementById('item-form-id').value = item.id;
      document.getElementById('item-form-name').value = item.name;
      document.getElementById('item-form-description').value = item.description || '';
      document.getElementById('item-form-material').value = item.material || '';
      document.getElementById('item-form-period').value = item.period || '';
      document.getElementById('item-form-dimensions').value = item.size || '';
      document.getElementById('item-form-source').value = item.source || '';
      document.getElementById('item-form-notes').value = item.notes || '';
      document.getElementById('item-form-category').value = item.category_id;

      // 加载现有图片
      editingItemImages = item.images ? [...item.images] : [];
      refreshImagePreviews();
      updateImagesInput();

      document.getElementById('item-modal').classList.add('active');
    }

    document.getElementById('item-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('item-id').value;
      const newId = document.getElementById('item-form-id').value;

      const itemData = {
        id: newId,
        name: document.getElementById('item-form-name').value,
        category_id: document.getElementById('item-form-category').value,
        description: document.getElementById('item-form-description').value,
        material: document.getElementById('item-form-material').value,
        period: document.getElementById('item-form-period').value,
        size: document.getElementById('item-form-dimensions').value,
        source: document.getElementById('item-form-source').value,
        notes: document.getElementById('item-form-notes').value,
        images: editingItemImages,
        likes: 0,
        comments: 0,
        collections: 0
      };

      // 保留原有的 likes 等数据
      if (id) {
        const existing = items.find(i => i.id === id);
        if (existing) {
          itemData.likes = existing.likes || 0;
          itemData.comments = existing.comments || 0;
          itemData.collections = existing.collections || 0;
          itemData.date = existing.date || new Date().toISOString().split('T')[0];
        }
      } else {
        itemData.date = new Date().toISOString().split('T')[0];
      }

      try {
        if (id && id !== newId) {
          items = items.filter(i => i.id !== id);
          await supabaseAdmin.from('items').delete().eq('id', id);
        }
        const idx = items.findIndex(i => i.id === newId);
        if (idx >= 0) items[idx] = itemData;
        else items.push(itemData);

        await supabaseAdmin.from('items').upsert(itemData, { onConflict: 'id' });

        document.getElementById('item-modal').classList.remove('active');
        updateStats();
        renderItems();
        showNotification('藏品保存成功');
      } catch (err) {
        console.error(err);
        showNotification('保存失败: ' + err.message, 'error');
      }
    });

    // ========== 搜索和筛选 ==========
    let searchTimeout;
    document.getElementById('item-search').addEventListener('input', e => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        renderItems(e.target.value, document.getElementById('item-filter-category').value);
      }, 300);
    });

    document.getElementById('item-filter-category').addEventListener('change', e => {
      renderItems(document.getElementById('item-search').value, e.target.value);
    });

    // ========== 删除 ==========
    function confirmDelete(type, id) {
      deleteTarget = { type, id };
      document.getElementById('delete-modal').classList.add('active');
    }

    document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
      if (!deleteTarget) return;

      try {
        if (deleteTarget.type === 'category') {
          categories = categories.filter(c => c.id !== deleteTarget.id);
          await supabaseAdmin.from('categories').delete().eq('id', deleteTarget.id);
          renderCategories();
          populateCategorySelects();
        } else {
          const item = items.find(i => i.id === deleteTarget.id);
          // 删除关联图片
          if (item && item.images) {
            for (const img of item.images) {
              await deleteImage(img);
            }
          }
          items = items.filter(i => i.id !== deleteTarget.id);
          await supabaseAdmin.from('items').delete().eq('id', deleteTarget.id);
          renderItems(document.getElementById('item-search').value, document.getElementById('item-filter-category').value);
        }

        updateStats();
        document.getElementById('delete-modal').classList.remove('active');
        showNotification('删除成功');
      } catch (err) {
        console.error(err);
        showNotification('删除失败: ' + err.message, 'error');
      } finally {
        deleteTarget = null;
      }
    });

    // ========== 关闭模态框 ==========
    ['close-category-modal', 'cancel-category-btn'].forEach(id =>
      document.getElementById(id).addEventListener('click', () => document.getElementById('category-modal').classList.remove('active')));
    ['close-item-modal', 'cancel-item-btn'].forEach(id =>
      document.getElementById(id).addEventListener('click', () => document.getElementById('item-modal').classList.remove('active')));
    document.getElementById('close-delete-modal').addEventListener('click', () => document.getElementById('delete-modal').classList.remove('active'));
    document.getElementById('cancel-delete-btn').addEventListener('click', () => document.getElementById('delete-modal').classList.remove('active'));

    // ========== 数据导出 ==========
    function downloadJSON(data, filename) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('export-categories-btn').addEventListener('click', () => {
      downloadJSON(categories, 'categories.json');
      showNotification('分类数据导出成功');
    });

    document.getElementById('export-items-btn').addEventListener('click', () => {
      downloadJSON(items, 'items.json');
      showNotification('藏品数据导出成功');
    });

    document.getElementById('export-all-btn').addEventListener('click', () => {
      downloadJSON({ categories, items }, 'dayuan-collection-data.json');
      showNotification('全部数据导出成功');
    });

    // ========== 数据导入 ==========
    document.getElementById('import-data-btn').addEventListener('click', () => {
      const fileInput = document.getElementById('import-file');
      if (!fileInput.files[0]) {
        showNotification('请先选择文件', 'warning');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);

          if (data.categories && data.items) {
            categories = data.categories;
            items = data.items;
          } else if (Array.isArray(data)) {
            items = data[0]?.category_id ? data : categories;
            if (!data[0]?.category_id) categories = data;
          }

          for (const cat of categories) {
            await supabaseAdmin.from('categories').upsert(cat, { onConflict: 'id' });
          }
          for (const item of items) {
            await supabaseAdmin.from('items').upsert(item, { onConflict: 'id' });
          }

          updateStats();
          renderCategories();
          renderItems();
          populateCategorySelects();
          showNotification('数据导入成功');
        } catch (err) {
          console.error(err);
          showNotification('导入失败，文件格式不正确', 'error');
        }
      };
      reader.readAsText(fileInput.files[0]);
    });

    // ========== 初始化 ==========
    initApp();
  </script>
</body>
</html>
